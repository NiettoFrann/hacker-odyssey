<VirtualHost *:80>
    ServerName backstage.lab
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # MISCONFIG 1: listado de directorio activado en la carpeta de respaldos.
    <Directory /var/www/html/backup>
        Options +Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # El panel interno está protegido con autenticación básica.
    <Directory /var/www/html/internal>
        AuthType Basic
        AuthName "Backstage Internal - Restricted"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
