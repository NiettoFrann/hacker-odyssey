server {
    listen 80 default_server;
    server_name foundry.lab;
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # MISCONFIG: el directorio de artefactos del pipeline quedó con el
    # listado automático activado y publicado hacia afuera.
    location /artifacts/ {
        autoindex on;
    }
}
