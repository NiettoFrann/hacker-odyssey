<VirtualHost *:80>
    ServerName switchboard.lab
    DocumentRoot /var/www/html

    # MISCONFIG: listado de directorios activado en todo el sitio. Esto
    # deja navegable la carpeta .git/ que se desplegó por error dentro
    # del webroot.
    <Directory /var/www/html>
        Options +Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
