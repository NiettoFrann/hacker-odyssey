<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Hacker Odyssey</title>
  <desc id="d">Banner del repositorio: informes de pentest sobre máquinas de Hack The Box y labs propios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="0.55" stop-color="#0F1726"/>
      <stop offset="1" stop-color="#141D2B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4FF5A"/>
      <stop offset="1" stop-color="#6EDC00"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#9FEF00" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9FEF00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.025"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FEF00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9FEF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#scan)"/>

  <!-- red de fondo -->
  <g fill="none" stroke="url(#wire)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M0 304 H160 L190 284 H400 L420 304 H700 L730 284 H960 L990 304 H1200"/>
    <path d="M0 46 H120 L148 70 H250" opacity="0.5"/>
    <path d="M560 40 H760 L784 56 H810" opacity="0.4"/>
  </g>
  <g fill="#9FEF00">
    <circle cx="190" cy="284" r="4"/><circle cx="420" cy="304" r="4"/>
    <circle cx="730" cy="284" r="4"/><circle cx="990" cy="304" r="4"/>
    <circle cx="250" cy="70" r="3" fill="#38BDF8"/><circle cx="810" cy="56" r="3" fill="#38BDF8"/>
  </g>

  <!-- paquete que recorre la red -->
  <circle r="5" fill="#ECFFC2" filter="url(#soft)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M0 304 H160 L190 284 H400 L420 304 H700 L730 284 H960 L990 304 H1200"/>
  </circle>

  <!-- emblema: escudo con prompt -->
  <circle cx="170" cy="160" r="100" fill="url(#glow)"/>
  <g transform="translate(170 160)">
    <path d="M0 -70 L56 -48 V4 C56 38 30 62 0 76 C-30 62 -56 38 -56 4 V-48 Z" fill="#0A0F1A" stroke="url(#green)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -56 L44 -39 V3 C44 30 24 49 0 61 C-24 49 -44 30 -44 3 V-39 Z" fill="none" stroke="#9FEF00" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M-26 -16 L-6 2 L-26 20" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <rect x="2" y="15" width="26" height="7" rx="2" fill="#9FEF00" filter="url(#soft)">
      <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- textos -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="292" y="122" fill="#94A3B8" font-size="15" font-weight="600" letter-spacing="5">BITÁCORA DE SEGURIDAD OFENSIVA</text>
    <text x="290" y="184" fill="#F8FAFC" font-size="58" font-weight="800" letter-spacing="-1">Hacker <tspan fill="url(#green)">Odyssey</tspan></text>
    <text x="292" y="220" fill="#CBD5E1" font-size="19">Informes de pentest con formato de auditoría real</text>
  </g>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    <rect x="292" y="240" width="132" height="28" rx="14" fill="#9FEF00" fill-opacity="0.12" stroke="#9FEF00" stroke-opacity="0.6"/>
    <text x="358" y="258" fill="#C6FF5A" text-anchor="middle">HACK THE BOX</text>
    <rect x="434" y="240" width="186" height="28" rx="14" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="527" y="258" fill="#7DD3FC" text-anchor="middle">INFORMES · HALLAZGOS</text>
    <rect x="630" y="240" width="134" height="28" rx="14" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text x="697" y="258" fill="#C4B5FD" text-anchor="middle">LABS · DOCKER</text>
  </g>

  <!-- terminal -->
  <g transform="translate(822 74)">
    <rect width="340" height="186" rx="12" fill="#070B12" fill-opacity="0.85" stroke="#9FEF00" stroke-opacity="0.35"/>
    <path d="M0 12 A12 12 0 0 1 12 0 H328 A12 12 0 0 1 340 12 V28 H0 Z" fill="#1E293B" fill-opacity="0.8"/>
    <circle cx="16" cy="14" r="4.5" fill="#E5484D"/>
    <circle cx="32" cy="14" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="14" r="4.5" fill="#9FEF00"/>
    <text x="170" y="18" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" text-anchor="middle">niettofran@odyssey: ~/htb</text>

    <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
      <text x="16" y="54" fill="#E2E8F0" opacity="0"><tspan fill="#9FEF00">$</tspan> nmap -sC -sV 10.10.11.x
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.05;0.93;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="16" y="74" fill="#94A3B8" opacity="0">22/tcp  open  ssh
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.13;0.14;0.93;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="16" y="94" fill="#94A3B8" opacity="0">80/tcp  open  http
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.18;0.93;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="16" y="118" fill="#E2E8F0" opacity="0"><tspan fill="#9FEF00">$</tspan> ./exploit.py  <tspan fill="#7DD3FC">→ www-data</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.31;0.93;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="16" y="140" fill="#E2E8F0" opacity="0"><tspan fill="#9FEF00">$</tspan> sudo -l  <tspan fill="#F59E0B">→ privesc</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.43;0.93;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="16" y="164" fill="#E2E8F0" opacity="0"><tspan fill="#E5484D">#</tspan> cat root.txt  <tspan fill="#9FEF00">✔ pwned</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.55;0.93;1" dur="9s" repeatCount="indefinite"/></text>
    </g>
    <rect x="16" y="170" width="8" height="3" fill="#9FEF00">
      <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
