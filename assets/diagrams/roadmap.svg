<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="t d">
  <title id="t">Ruta de entrenamiento</title>
  <desc id="d">Starting Point: Tier 0 (6 de 8, en curso), Tier 1 (0 de 10, pendiente), Tier 2 (1 de 7, en curso). Machines: Easy (7 informes, en curso), Medium, Hard e Insane (pendientes). Labs propios: Backstage, Foundry y Switchboard (publicados).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="1" stop-color="#141D2B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4FF5A"/>
      <stop offset="1" stop-color="#6EDC00"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="570" rx="16" fill="url(#bg)"/>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="52" fill="#F8FAFC" font-size="22" font-weight="800">Ruta de entrenamiento</text>
    <text x="40" y="76" fill="#94A3B8" font-size="14">Progreso por categoría · máquinas con informe publicado</text>

    <!-- ============ PISTA: STARTING POINT ============ -->
    <text x="40" y="128" fill="#9FEF00" font-size="12" font-weight="800" letter-spacing="3">⚑ STARTING POINT</text>
    <line x1="140" y1="190" x2="860" y2="190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="190" x2="320" y2="190" stroke="#9FEF00" stroke-width="4" stroke-linecap="round"/>

    <!-- Tier 0: 6/8 -->
    <g transform="translate(140 190)">
      <circle r="28" fill="#9FEF00" fill-opacity="0.16" filter="url(#soft)">
        <animate attributeName="r" values="24;32;24" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="24" fill="#0A0F1A" stroke="#334155" stroke-width="4"/>
      <circle r="24" fill="none" stroke="#9FEF00" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1 150.8" transform="rotate(-90)"/>
      <circle r="17" fill="url(#green)"/>
      <text y="5" fill="#0A0F1A" font-size="13" font-weight="800" text-anchor="middle">T0</text>
      <text y="-38" fill="#F8FAFC" font-size="15" font-weight="700" text-anchor="middle">Tier 0</text>
      <rect x="-54" y="32" width="108" height="22" rx="11" fill="#9FEF00" fill-opacity="0.15" stroke="#9FEF00"/>
      <text y="47" fill="#C6FF5A" font-size="11" font-weight="800" text-anchor="middle">EN CURSO · 6/8</text>
    </g>

    <!-- Tier 1: 0/10 -->
    <g transform="translate(500 190)">
      <circle r="24" fill="#0A0F1A" stroke="#334155" stroke-width="4"/>
      <circle r="17" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <text y="5" fill="#CBD5E1" font-size="13" font-weight="800" text-anchor="middle">T1</text>
      <text y="-38" fill="#E2E8F0" font-size="15" font-weight="700" text-anchor="middle">Tier 1</text>
      <rect x="-54" y="32" width="108" height="22" rx="11" fill="none" stroke="#475569"/>
      <text y="47" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle">PENDIENTE · 0/10</text>
    </g>

    <!-- Tier 2: 1/7 -->
    <g transform="translate(860 190)">
      <circle r="24" fill="#0A0F1A" stroke="#334155" stroke-width="4"/>
      <circle r="24" fill="none" stroke="#9FEF00" stroke-width="4" stroke-linecap="round" stroke-dasharray="21.5 150.8" transform="rotate(-90)"/>
      <circle r="17" fill="#1E293B" stroke="#9FEF00" stroke-opacity="0.7" stroke-width="2"/>
      <text y="5" fill="#C6FF5A" font-size="13" font-weight="800" text-anchor="middle">T2</text>
      <text y="-38" fill="#E2E8F0" font-size="15" font-weight="700" text-anchor="middle">Tier 2</text>
      <rect x="-54" y="32" width="108" height="22" rx="11" fill="#9FEF00" fill-opacity="0.10" stroke="#9FEF00" stroke-opacity="0.6"/>
      <text y="47" fill="#C6FF5A" font-size="11" font-weight="800" text-anchor="middle">EN CURSO · 1/7</text>
    </g>

    <!-- ============ PISTA: MACHINES ============ -->
    <text x="40" y="278" fill="#38BDF8" font-size="12" font-weight="800" letter-spacing="3">▤ MACHINES</text>
    <line x1="140" y1="340" x2="860" y2="340" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="340" x2="260" y2="340" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Easy -->
    <g transform="translate(140 340)">
      <circle r="28" fill="#38BDF8" fill-opacity="0.16" filter="url(#soft)">
        <animate attributeName="r" values="24;32;24" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="20" fill="url(#cyan)"/>
      <text y="5" fill="#0A0F1A" font-size="13" font-weight="800" text-anchor="middle">01</text>
      <text y="-38" fill="#F8FAFC" font-size="15" font-weight="700" text-anchor="middle">Easy</text>
      <rect x="-54" y="32" width="108" height="22" rx="11" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8"/>
      <text y="47" fill="#7DD3FC" font-size="11" font-weight="800" text-anchor="middle">EN CURSO · 7</text>
    </g>

    <g transform="translate(380 340)">
      <circle r="18" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <text y="5" fill="#CBD5E1" font-size="13" font-weight="800" text-anchor="middle">02</text>
      <text y="-38" fill="#E2E8F0" font-size="15" font-weight="700" text-anchor="middle">Medium</text>
      <rect x="-44" y="32" width="88" height="22" rx="11" fill="none" stroke="#475569"/>
      <text y="47" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle">PENDIENTE</text>
    </g>

    <g transform="translate(620 340)">
      <circle r="18" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <text y="5" fill="#CBD5E1" font-size="13" font-weight="800" text-anchor="middle">03</text>
      <text y="-38" fill="#E2E8F0" font-size="15" font-weight="700" text-anchor="middle">Hard</text>
      <rect x="-44" y="32" width="88" height="22" rx="11" fill="none" stroke="#475569"/>
      <text y="47" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle">PENDIENTE</text>
    </g>

    <g transform="translate(860 340)">
      <circle r="18" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <text y="5" fill="#CBD5E1" font-size="13" font-weight="800" text-anchor="middle">04</text>
      <text y="-38" fill="#E2E8F0" font-size="15" font-weight="700" text-anchor="middle">Insane</text>
      <rect x="-44" y="32" width="88" height="22" rx="11" fill="none" stroke="#475569"/>
      <text y="47" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle">PENDIENTE</text>
    </g>

    <!-- ============ PISTA: LABS PROPIOS ============ -->
    <text x="40" y="428" fill="#A78BFA" font-size="12" font-weight="800" letter-spacing="3">⚗ LABS PROPIOS</text>
    <line x1="140" y1="490" x2="620" y2="490" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"/>
    <line x1="640" y1="490" x2="840" y2="490" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>

    <g transform="translate(140 490)">
      <circle r="18" fill="url(#violet)"/>
      <text y="5" fill="#0A0F1A" font-size="12" font-weight="800" text-anchor="middle">13</text>
      <text y="-38" fill="#F8FAFC" font-size="15" font-weight="700" text-anchor="middle">Backstage</text>
      <rect x="-48" y="32" width="96" height="22" rx="11" fill="#A78BFA" fill-opacity="0.15" stroke="#A78BFA"/>
      <text y="47" fill="#C4B5FD" font-size="11" font-weight="800" text-anchor="middle">PUBLICADO</text>
    </g>

    <g transform="translate(380 490)">
      <circle r="18" fill="url(#violet)"/>
      <text y="5" fill="#0A0F1A" font-size="12" font-weight="800" text-anchor="middle">14</text>
      <text y="-38" fill="#F8FAFC" font-size="15" font-weight="700" text-anchor="middle">Foundry</text>
      <rect x="-48" y="32" width="96" height="22" rx="11" fill="#A78BFA" fill-opacity="0.15" stroke="#A78BFA"/>
      <text y="47" fill="#C4B5FD" font-size="11" font-weight="800" text-anchor="middle">PUBLICADO</text>
    </g>

    <g transform="translate(620 490)">
      <circle r="18" fill="url(#violet)"/>
      <text y="5" fill="#0A0F1A" font-size="12" font-weight="800" text-anchor="middle">15</text>
      <text y="-38" fill="#F8FAFC" font-size="15" font-weight="700" text-anchor="middle">Switchboard</text>
      <rect x="-48" y="32" width="96" height="22" rx="11" fill="#A78BFA" fill-opacity="0.15" stroke="#A78BFA"/>
      <text y="47" fill="#C4B5FD" font-size="11" font-weight="800" text-anchor="middle">PUBLICADO</text>
    </g>

    <g transform="translate(860 490)">
      <circle r="14" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>
      <text y="6" fill="#64748B" font-size="16" font-weight="800" text-anchor="middle">+</text>
      <text y="40" fill="#64748B" font-size="12" text-anchor="middle">próximos labs</text>
    </g>
  </g>
</svg>
